server:
  port: 18084
config:
  config-string: application,manager,m-cmp

app:
  ibm-ingress:
    automation:
      # cluster: 선택한 IBM 클러스터의 공식 Secret Provider로 IAM 단기 토큰을 자동 발급/갱신.
      # 새 AM 서버에도 OpenBao/AppRole 초기 등록 불필요. 추가 LB를 만들지 않고 기존 관리형 ALB 사용.
      # openbao: 기존 운영자 등록 AppRole/토큰 파일 사용. cluster 실패 시 OpenBao로 자동 우회하지 않음.
      credential-source: ${IBM_INGRESS_CREDENTIAL_SOURCE:cluster}
      # true: 배포 시 기존 공유 ALB의 PROXY 자동 준비 허용. false: 준비가 필요한 클러스터 배포 차단.
      # 연결별 profiles 값이 있으면 해당 값을 우선. 초기 PROXY 활성화 중 기존 연결이 잠시 끊길 수 있음.
      allow-shared-lb-changes: ${IBM_INGRESS_ALLOW_SHARED_LB_CHANGES:true}
      # 아래 OpenBao 값은 credential-source=openbao인 환경에서만 사용.
      open-bao-url: ${IBM_INGRESS_OPEN_BAO_URL:http://mc-infra-manager-openbao:8200}
      open-bao-token-file: ${IBM_INGRESS_OPEN_BAO_TOKEN_FILE:/run/secrets/am-ibm-openbao-token}
      # 통합 배포가 이미 마운트하는 /nexus-data에 무작위 암호화 키를 보관. 토큰 원문은 DB/이미지에 저장하지 않음.
      # 재배포 시 AM DB와 이 키 파일을 함께 유지해야 저장한 인증 설정을 다시 사용할 수 있음.
      credential-key-file: ${IBM_INGRESS_CREDENTIAL_KEY_FILE:/nexus-data/.am/ibm-openbao.key}
      profiles:
        - namespace: ${IBM_INGRESS_NAMESPACE:default}
          connection-name: ${IBM_INGRESS_CONNECTION_NAME:ibm-jp-tok}
          region: ${IBM_INGRESS_REGION:jp-tok}
          allow-shared-lb-changes: ${IBM_INGRESS_ALLOW_SHARED_LB_CHANGES:true}
          secret-path: ${IBM_INGRESS_SECRET_PATH:secret/data/csp/ibm}
  nhn-cinder-addon:
    # true: NHN Cinder CSI addon 설치 기능 활성화, false: 설치 기능 비활성화 (다른 CSP에는 적용하지 않음).
    # 환경변수 NHN_CINDER_ADDON_ENABLED로 재정의 가능. 변경 후 AM 재시작 필요.
    # 기본 cluster 방식은 선택한 NKS의 위임 인증을 사용하며 AM용 OpenBao 토큰/초기 설정이 필요하지 않음.
    enabled: ${NHN_CINDER_ADDON_ENABLED:true}
    credential-source: ${NHN_CINDER_ADDON_CREDENTIAL_SOURCE:cluster}
    # 아래 OpenBao 설정 및 bindings는 credential-source: openbao를 명시한 기존 방식에서만 사용.
    open-bao-url: ${NHN_CINDER_ADDON_OPEN_BAO_URL:http://mc-infra-manager-openbao:8200}
    # NHN 자격증명 읽기 전용 OpenBao 토큰 파일을 컨테이너에 읽기 전용으로 마운트 (토큰 값은 YAML에 저장하지 않음).
    open-bao-token-file: ${NHN_CINDER_ADDON_OPEN_BAO_TOKEN_FILE:/run/secrets/am-nhn-openbao-token}
    # openbao 방식에서만 Tumblebug namespace/connection-name과 자격증명 경로를 연결.
    bindings:
      - namespace: ${NHN_CINDER_ADDON_NAMESPACE:default}
        connection-name: ${NHN_CINDER_ADDON_CONNECTION_NAME:nhn-kr1}
        region: ${NHN_CINDER_ADDON_REGION:kr1}
        secret-path: ${NHN_CINDER_ADDON_SECRET_PATH:secret/data/csp/nhn}
  vm-deployment:
    # Remote pulls are bounded; command HTTP waits allow an additional 120 seconds.
    image-pull-timeout-seconds: ${VM_IMAGE_PULL_TIMEOUT_SECONDS:1800}
  object-storage:
    k8s-transport: ${OBJECT_STORAGE_K8S_TRANSPORT:SSH_TUNNEL}
    k8s-ssh-image: ${OBJECT_STORAGE_K8S_SSH_IMAGE:lscr.io/linuxserver/openssh-server@sha256:39ba37d50fdd6be1bf70644c871e5dcb9234ee79ac56424ea03ca08cadf1e7b0}
    k8s-ssh-keygen: ${OBJECT_STORAGE_K8S_SSH_KEYGEN:ssh-keygen}
    transport: ${OBJECT_STORAGE_TRANSPORT:SSH_TUNNEL}
    tunnel:
      ssh-executable: ${OBJECT_STORAGE_SSH_EXECUTABLE:ssh}
    gateway-public-base-url: ${OBJECT_STORAGE_GATEWAY_PUBLIC_BASE_URL:http://localhost:18084}
    # Full gateway URL reachable from K8s Pods; independent of VM SSH transport.
    # k8s-gateway-url: ${OBJECT_STORAGE_K8S_GATEWAY_URL:}
    # k8s-allow-http: ${OBJECT_STORAGE_K8S_ALLOW_HTTP:false}
    k8s-gateway-url: ${OBJECT_STORAGE_K8S_GATEWAY_URL:http://210.219.181.78:18084/applications/object-storage-gateway}
    k8s-allow-http: ${OBJECT_STORAGE_K8S_ALLOW_HTTP:true}
    k8s-ready-timeout-seconds: ${OBJECT_STORAGE_K8S_READY_TIMEOUT_SECONDS:1800}
    grant-ttl-hours: ${OBJECT_STORAGE_GATEWAY_GRANT_TTL_HOURS:8760}
    presigned-url-ttl-seconds: ${OBJECT_STORAGE_PRESIGNED_URL_TTL_SECONDS:600}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  project-scope:
    enabled: ${PROJECT_SCOPE_ENFORCEMENT_ENABLED:true}
    iam-base-url: ${IAM_BASE_URL:http://mc-iam-manager:5000}
    connect-timeout: ${IAM_CONNECT_TIMEOUT:2s}
    read-timeout: ${IAM_READ_TIMEOUT:5s}

spring:
  application:
    name: application-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://210.217.178.130:18085/appmgr}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:application}
    password: ${DB_PASS:application!23}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update} # ${DDL_AUTO:none}
    
# ddl-auto: create # 실행할 때에 테이블을 자동으로 생성시킬것인지 #create-drop, update, validate, none
# create : SessionFactory 시작시 스키마를 삭제하고 다시 생성
# create-drop : SessionFactory 종료 시 스키마를 삭제
# update : SessionFactory 연결된 DB와 비교하여 추가된 항목은 추가 만약 같은 변수명이면 오류발생
# validate : SessionFactory 시작시 객체구성과 스키마가 다르다면 예외 발생
# none : 아무것도 안함
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        hbm2ddl: # 처음에 더미데이터등을 넣기위해 sql을 실행
          #import_files: ./data.sql # 확인필요
          import_files:
          import_files_sql_extractor: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor # 멀티 라인 입력 가능하도록
        connection:
          charSet: UTF-8 # 인코딩 설정
  sql:
    init:
      data-locations: classpath:./import.sql
      mode: ${SQL_DATA_INIT:never} #${SQL_DATA_INIT:always} # ${SQL_DATA_INIT:never}
      platform: postgresql
      #schema-locations: classpath:ddl.sql

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
object:
  object-mapper-pretty-print: true

aes:
  key: fb1755281b0ca6184a0ee644e6477ee7

cbtumblebug:
  url: ${TUMBLEBUG_URL:210.217.178.130}
  port: ${TUMBLEBUG_PORT:1323}
  id: ${TUMBLEBUG_ID:default}
  pass: ${TUMBLEBUG_PASSWORD:default}

nexus:
  url: ${NEXUS_URL:210.217.178.130}
  port: ${NEXUS_PORT:8081}
  docker-port: ${NEXUS_DOCKER_PORT:5000}
  # Optional AM-reachable image Registry endpoint, separate from the Nexus REST URL.
  registry-endpoint: ${NEXUS_DOCKER_REGISTRY_URL:}
  username: ${NEXUS_USERNAME:admin}
  password: ${NEXUS_PASSWORD:123456}
  docker-repository: ${NEXUS_DOCKER_REPOSITORY:docker-hosted}
  helm-repository: ${NEXUS_HELM_REPOSITORY:helm-hosted}
  hybrid-mode: ${NEXUS_HYBRID_MODE:true}
  use-external-docker-hub: ${NEXUS_USE_EXTERNAL_DOCKER_HUB:true}
  use-external-artifact-hub: ${NEXUS_USE_EXTERNAL_ARTIFACT_HUB:true}

file:
  upload:
    path:
      windows: C:/mcmp/uploads/
      linux: /home/mcmp/uploads/
    allowed-extensions: jpg,jpeg,png,gif

k8s:
  autoscaling:
    default-max-nodes: ${K8S_DEFAULT_MAX_NODES:3}
    scaling-timeout-seconds: ${K8S_SCALING_TIMEOUT_SECONDS:300}
    default-node-count: ${K8S_DEFAULT_NODE_COUNT:1}
    # 테스트 모드 설정
    test-mode: ${K8S_TEST_MODE:true}  # true: 낮은 임계값으로 스케일 아웃 테스트, false: 운영 모드
    test-cpu-threshold: ${K8S_TEST_CPU_THRESHOLD:0.0001}  # 테스트 모드 CPU 임계값 (%) - 매우 낮게 설정
    test-memory-threshold: ${K8S_TEST_MEMORY_THRESHOLD:0.0001}  # 테스트 모드 Memory 임계값 (%) - 매우 낮게 설정

rabbitmq:
  alert:
    url: ${RABBITMQ_URL:210.207.104.130}
    port: ${RABBITMQ_PORT:15672}
    vhost: ${RABBITMQ_VHOST:test}
    username: ${RABBITMQ_USERNAME:mc-agent}
    password: ${RABBITMQ_PASSWORD:mc-agent}
    slack-channel-id: ${ALERT_SLACK_CHANNEL_ID:}
    email: ${ALERT_EMAIL:}
    sms-phonenumber: ${ALERT_SMS_PHONE_NUMBER:}
    kakao-phonenumber: ${ALERT_KAKAO_PHONE_NUMBER:}
