image: httpd:2.4-alpine@sha256:4e585da9d0125dec36d4500a9f5c5df7b2c0a01f67cb47865a91a4b05bdbec1b
uid: 1001
containerPort: 8080
service: {type: ClusterIP, port: 80}
container:
  command: [httpd, -DFOREGROUND, -f, /usr/local/apache2/conf/am-httpd.conf]
  readinessProbe: {httpGet: {path: /, port: app}, periodSeconds: 5}
  livenessProbe: {httpGet: {path: /, port: app}, initialDelaySeconds: 15, periodSeconds: 10}
config:
  httpd.conf:
    path: /usr/local/apache2/conf/am-httpd.conf
    content: |
      ServerRoot "/usr/local/apache2"
      Listen 8080
      ServerName localhost
      LoadModule mpm_event_module modules/mod_mpm_event.so
      LoadModule authz_core_module modules/mod_authz_core.so
      LoadModule unixd_module modules/mod_unixd.so
      LoadModule dir_module modules/mod_dir.so
      LoadModule mime_module modules/mod_mime.so
      PidFile /tmp/httpd.pid
      ErrorLog /proc/self/fd/2
      LogLevel warn
      TypesConfig conf/mime.types
      DocumentRoot "/usr/local/apache2/htdocs"
      DirectoryIndex index.html
      <Directory "/usr/local/apache2/htdocs">
        Require all granted
      </Directory>
