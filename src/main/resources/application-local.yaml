# =====================================================================
# Local profile for AM archiving verification
# Activate with:  --spring.profiles.active=local
#
# Purpose:
#   - Boot the application against the dev PostgreSQL/Tumblebug servers
#   - Auto-create the new archiving tables (ddl-auto: update)
#   - Keep local deployment tests from running background schedulers
#   - Surface Hibernate DDL and our package logs for visual verification
#
# Notes:
#   - All connection endpoints inherit defaults from application.yaml
#     (PostgreSQL/Tumblebug/Spider on 210.217.178.130)
#   - Override only what is useful for local boot-time verification
#   - Set APP_SCHEDULING_ENABLED=true only when intentionally testing schedulers locally
# =====================================================================

app:
  nhn-cinder-addon:
    # 로컬 NHN 설치 버튼용 인증 연결. 활성화 여부는 application.yaml의 enabled 설정을 따름.
    # 토큰은 Git에 포함하지 않는 별도 파일로 보관하며, NHN 자격증명 경로의 읽기 권한만 필요.
    open-bao-url: ${NHN_CINDER_ADDON_OPEN_BAO_URL:http://210.217.178.130:8200}
    open-bao-token-file: ${NHN_CINDER_ADDON_OPEN_BAO_TOKEN_FILE:${user.dir}/.local-secrets/nhn-openbao-token}
    bindings:
      - namespace: ${NHN_CINDER_ADDON_NAMESPACE:default}
        connection-name: ${NHN_CINDER_ADDON_CONNECTION_NAME:nhn-kr1}
        region: ${NHN_CINDER_ADDON_REGION:kr1}
        secret-path: ${NHN_CINDER_ADDON_SECRET_PATH:secret/data/csp/nhn}
  scheduling:
    enabled: false
  # Standalone local UI can run without Web Console/IAM context.
  # Set PROJECT_SCOPE_ENFORCEMENT_ENABLED=true for local integration tests.
  project-scope:
    enabled: ${PROJECT_SCOPE_ENFORCEMENT_ENABLED:false}

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    kr.co.mcmp.softwarecatalog.application.service.impl.DailyAggregationScheduler: DEBUG
    kr.co.mcmp.softwarecatalog.docker.service.DockerMonitoringService: DEBUG
    kr.co.mcmp.softwarecatalog.kubernetes.service.KubernetesMonitoringService: DEBUG
